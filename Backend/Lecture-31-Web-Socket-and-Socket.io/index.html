<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat App</title>
  </head>
  <body
    style="
      height: 100vh;
      width: 100vw;
      display: flex;
      flex-direction: column;
      gap: 10px;
      justify-content: center;
      align-items: center;
    "
  >
    <h1>Chat With Me!</h1>

    <input type="text" placeholder="Enter the room ID" id="roomNumber" />
    <button onclick="joinRoom()">Join</button>

    <div
      id="messageDisplay"
      style="
        height: 50vh;
        background-color: rgb(213, 206, 206);
        width: 50vw;
        margin-bottom: 20px;
        padding: 10px;
      "
    >
      your message will be displayed...
    </div>
    <input
      type="text"
      id="message"
      placeholder="type your message here"
      style="padding: 5px"
    />

    <button onclick="sendMessage()" id="sendBtn">Send</button>
    <script src="/socket.io/socket.io.js"></script>
    <script>
      const socket = io();
      //  console.log(socket);
      // console.log(socket.id); // you can't print the id like this because the socket is not connected to the server yet.
      socket.on("connect", () => {
        console.log(socket.id);
      });

      const messageDisplay = document.getElementById("messageDisplay");
      const msgInput = document.getElementById("message");
      const roomNumber = document.getElementById("roomNumber");
      let roomId = null;

      function sendMessage() {
        const msg = msgInput.value;
        socket.emit("message", { room: roomId, msg });
        msgInput.value = "";
        const element = document.createElement("div");
        element.textContent = msg;
        element.style.textAlign = "right";
        messageDisplay.appendChild(element);
      }

      function joinRoom() {
        const room = roomNumber.value;
        roomId = room;
        socket.emit("join-room", roomId);
      }

      socket.on("new-message", (data) => {
        const element = document.createElement("div");
        element.textContent = data;
        messageDisplay.appendChild(element);
      });
    </script>
  </body>
</html>
