<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tawla - Delivery</title>

    <link rel="stylesheet" href="../style.css" />
  </head>

  <body>
    <!-- Header -->
    <header>
      <nav>
        <h1 id="logo">Tawla</h1>
        <div class="auth-buttons">
          <button id="signup">Sign Up</button>
          <button id="login">Login</button>
        </div>
      </nav>
    </header>

    <!-- Main -->
    <main class="mainContainer">
      <!-- Category -->
      <section class="secondHeader">
        <div class="category">
          <img
            src="https://b.zmtcdn.com/data/o2_assets/30fa0a844f3ba82073e5f78c65c18b371616149662.png"
          />
          <button id="diningOut">Dining Out</button>
        </div>

        <div class="category">
          <img
            src="https://b.zmtcdn.com/data/o2_assets/246bbd71fbba420d5996452be3024d351616150055.png"
          />
          <button id="delivery">Delivery</button>
        </div>
      </section>

      <!-- Food -->
      <section id="inspirationForYou">
        <h2>Inspiration For Your First Order</h2>
        <div id="foodContainer"></div>
      </section>

      <!-- Brands -->
      <section id="topBrands">
        <h2>Top Brands</h2>
        <div id="brandsContainer"></div>
      </section>

      <!-- Restaurants -->
      <section class="container"></section>
    </main>

    <!-- Footer -->
    <footer>
      <div id="footerFirst">
        <h1>Tawla</h1>

        <div class="footer-selects">
          <select>
            <option>Saudi Arabia</option>
            <option>Pakistan</option>
            <option>Iran</option>
          </select>

          <select>
            <option>English</option>
            <option>Arabic</option>
            <option>Urdu</option>
          </select>
        </div>
      </div>

      <div id="lastFooter">
        <div class="footer-col">
          <h3>About</h3>
          <a href="#">Who we are</a>
          <a href="#">Blog</a>
        </div>

        <div class="footer-col">
          <h3>Learn More</h3>
          <a href="#">Privacy</a>
          <a href="#">Terms</a>
        </div>

        <div class="footer-col">
          <h3>Social</h3>
          <p>LinkedIn</p>
          <p>Instagram</p>
          <p>YouTube</p>
          <p>Facebook</p>
        </div>
      </div>
    </footer>

    <!-- JS -->
    <script src="../JS Files/main.js"></script>
  </body>
</html>
