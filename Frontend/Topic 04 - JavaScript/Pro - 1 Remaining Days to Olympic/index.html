<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Days remaining to Olympics 2028 || JavaScript Project</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <div class="upperContainer">
        <p>How many day until</p>
        <p class="heading">Summer Olympics 2028</p>
        <p id="occassionDate"></p>
        <p class="place">Los Angeles, USA</p>
      </div>
      <div class="lowerContainer">
        <div class="daysCont">
          <h1 id="days" class="days">0</h1>
          <p>days</p>
        </div>

        <div class="remainingItemCont">
          <div>
            <h3 id="hours" class="hours">0</h3>
            <p>hours</p>
          </div>

          <div>
            <h3 id="minutes" class="minutes">0</h3>
            <p>minutes</p>
          </div>

          <div>
            <h3 id="seconds" class="seconds">0</h3>
            <p>seconds</p>
          </div>
        </div>
      </div>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
