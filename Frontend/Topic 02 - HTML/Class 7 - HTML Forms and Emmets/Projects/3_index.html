<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form | Project 3</title>
  </head>
  <body>
    <form action="#">
      <h2>Feedback form</h2>
      <label for="name">Your Name: </label>
      <input type="text" placeholder="e.g. Shah Fahad" id="name" name="name" />
      <br />
      <br />

      <label for="email">Your Email: </label>
      <input
        type="email"
        placeholder="e.g. shah@gmail.com"
        id="email"
        name="email"
      />
      <br />
      <br />

      <label>Rate us: </label>
      <input type="radio" id="oneStar" name="star" />
      <label for="oneStar">1 Star</label>
      <input type="radio" id="twoStar" name="star" />
      <label for="twoStar">2 Stars</label>
      <input type="radio" id="threeStar" name="star" />
      <label for="threeStar">3 Stars</label>
      <input type="radio" id="fourStar" name="star" />
      <label for="fourStar">4 Stars</label>
      <input type="radio" id="fiveStar" name="star" />
      <label for="fiveStar">5 Stars</label>

      <br />
      <br />
      <label for="messaage">Comment: </label>
      <textarea
        name="Message"
        id="messaage"
        rows="10"
        cols="10"
        placeholder="write your comment here..."
      ></textarea>
      <br />
      <br />
      <button>Submit Feedback</button>
    </form>
  </body>
</html>
