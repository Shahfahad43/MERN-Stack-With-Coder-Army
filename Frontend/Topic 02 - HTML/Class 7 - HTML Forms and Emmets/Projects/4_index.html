<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form | Project 4</title>
  </head>
  <body>
    <form action="#">
      <h2>Employ Details Form</h2>
      <label for="name">Full Name: </label>
      <input type="text" placeholder="e.g. Shah Fahad" id="name" name="name" />
      <br />
      <br />
      <label for="email">Email: </label>
      <input
        type="email"
        placeholder="e.g. shah@gmail.com"
        id="email"
        name="email"
      />
      <br />
      <br />
      <label for="pNumber">Phone Number: </label>
      <input
        type="tel"
        placeholder="e.g. 12345678912"
        id="pNumber"
        name="number"
      />
      <br />
      <br />

      <label>Gender: </label>
      <input type="radio" id="male" name="gender" />
      <label for="male">Male</label>
      <input type="radio" id="female" name="gender" />
      <label for="female">Female</label>
      <input type="radio" id="other" name="gender" />
      <label for="other">Other</label>
      <br /><br />

      <label for="jobTitle">Job Title: </label>
      <input
        type="email"
        placeholder="e.g. Full Stack Website Developer"
        id="jobTitle"
        name="jobTitle"
      />
      <br /><br />

      <label for="department">Department: </label>
      <select name="job" id="job">
        <option value="websiteDeveloper">Website Developer</option>
        <option value="videoEditor">Video Editor</option>
        <option value="graphicsDesigner">Graphics Designer</option>
        <option value="UIUXDesigner">UI UX Designer</option>
      </select>
      <br /><br />

      <button>Submit</button>
    </form>
  </body>
</html>
