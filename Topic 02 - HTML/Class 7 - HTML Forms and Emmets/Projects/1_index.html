<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forms | Project 2</title>
  </head>
  <body>
    <form>
      <h2>Contact Us</h2>
      <label for="name">Full Name: </label>
      <input type="text" placeholder="e.g. Shah Fahad" id="name" name="name" />
      <br />
      <br />
      <label for="email">Email: </label>
      <input
        type="email"
        placeholder="e.g. shah@gmail.com"
        id="email"
        name="email"
      />
      <br />
      <br />
      <label for="pNumber">Phone Number: </label>
      <input
        type="tel"
        placeholder="e.g. 12345678912"
        id="pNumber"
        name="number"
      />
      <br />
      <br />
      <label for="messaage">Message: </label>
      <textarea name="Message" id="messaage"></textarea>
      <br />
      <br />
      <button>Send</button>
    </form>
  </body>
</html>
