<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Solar System | CSS Project</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="solar-system">
      <div id="sun"></div>

      <div class="orbit mercury-orbit">
        <div class="planet" id="mercury"></div>
      </div>

      <div class="orbit venus-orbit">
        <div class="planet" id="venus"></div>
      </div>

      <div class="orbit earth-orbit">
        <div class="planet" id="earth"></div>
      </div>

      <div class="orbit mars-orbit">
        <div class="planet" id="mars"></div>
      </div>

      <div class="orbit jupiter-orbit">
        <div class="planet" id="jupiter"></div>
      </div>

      <div class="orbit saturn-orbit">
        <div class="planet" id="saturn"></div>
      </div>

      <div class="orbit uranus-orbit">
        <div class="planet" id="uranus"></div>
      </div>

      <div class="orbit neptune-orbit">
        <div class="planet" id="neptune"></div>
      </div>
    </div>
  </body>
</html>
